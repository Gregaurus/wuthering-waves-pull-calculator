<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Calculation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculate Roll</h1>
        <label for="astrites">Astrites: </label>
        <input type="number" id="astrites" placeholder="Enter Astrites Amount">
        <label for="rTide">Radiant Tides: </label>
        <input type="number" id="rTide" placeholder="Enter Radiant Tides Amount">

        <!-- Presets now autosave on input changes -->

        <div class="result-container" role="region" aria-label="Calculation results">
            <div class="result-box">
                <span class="result-title">Pulls</span>
                <span class="result-value" id="rolls-result" role="status" aria-live="polite">0</span>
            </div>
            <div class="result-box">
                <span class="result-title">Remaining Astrites</span>
                <span class="result-value" id="remaining-astrites" role="status" aria-live="polite">0</span>
            </div>
                <div class="result-box">
                    <span class="result-title">Estimated Afterglow Crystals</span>
                <span class="result-value" id="bonus-afterglow" role="status" aria-live="polite">0</span>
            </div>
        </div>

        <div class="table-container">
            <h2>Pull Rate</h2>
            <table id="pull-table" role="table" aria-describedby="pull-desc">
                <caption id="pull-desc" class="visually-hidden">Table of pull costs by copy count</caption>
                <thead>
                    <tr>
                        <th>Copies</th>
                        <th>Lose Pity</th>
                        <th>Partial Pity</th>
                        <th>Win Pity</th>
                        <th>Average Pull</th>
                    </tr>
                </thead>
                <tbody id="pull-table-body">
                    <!-- Rows are rendered dynamically by script.js from a data array -->
                </tbody>
            </table>
        </div>

                <div class="estimation-container">
            <h2>Pull Estimation</h2>
            <div class="sim-controls">
                <label for="target-limited">How many limited 5 stars:</label>
                <input type="number" id="target-limited" value="1" min="0" class="small-input">

                <label for="target-confidence">How great are the chances (%)</label>
                <input type="number" id="target-confidence" value="90" min="1" max="99" class="small-input">

                <label for="sim-trials">Trials (per evaluation):</label>
                <input type="number" id="sim-trials-est" value="2000" min="100" class="small-input">

                <button id="estimate-astrites" type="button" class="btn secondary">Estimate Astrites</button>
            </div>
            <div id="estimate-result" class="sim-results" role="region" aria-live="polite"></div>
        </div>

        <div class="simulation-container">
            <h2>Banner Pull Trial</h2>
                <div class="sim-controls">
                <label for="sim-pulls">Pulls per Trial:</label>
                <input type="number" id="sim-pulls" value="100" min="1" class="small-input">

                <label for="sim-trials">Trials:</label>
                <input type="number" id="sim-trials" value="10000" min="1" class="small-input">
                <!-- <button id="run-sim" type="button" class="btn primary">Run Simulation</button> -->
            </div>
            <div id="sim-results" class="sim-results" role="region" aria-live="polite"></div>
            <div class="sim-visual">
                <div style="width:100%;display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                    <button id="plot-curves" type="button" class="btn">Plot Cumulative Curves</button>
                    <span style="font-size:13px;color:#555;">(Shows P(>=k limited) vs pulls)</span>
                </div>
                <!--
                    <div class="sim-hist-block">
                        <div class="sim-hist-label">Total 5 Star Copies</div>
                        <canvas id="sim-histogram" width="600" height="160" aria-hidden="true"></canvas>
                    </div>
                    <div class="sim-hist-block">
                        <div class="sim-hist-label">Total Limited 5 Star Copies</div>
                        <canvas id="sim-histogram-limited" width="600" height="160" aria-hidden="true"></canvas>
                    </div>
                -->
                <div class="sim-hist-block" style="flex-basis:100%;">
                    <div class="sim-hist-label">Cumulative Limited Probability Curves</div>
                    <canvas id="sim-curve" height="240" aria-hidden="true"></canvas>
                    <div id="sim-curve-tooltip" class="canvas-tooltip" aria-hidden="true" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
